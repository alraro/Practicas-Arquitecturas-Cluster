# Archivo ~/gitea/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gitea-hpa
  namespace: gitea
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gitea
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50