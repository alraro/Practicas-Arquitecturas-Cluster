# Archivo ~/monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Métricas del propio Prometheus ---
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # --- Node Exporter (Métricas de Hardware/SO) ---
  - job_name: node-compute
    static_configs:
      - targets:
          - 192.168.173.175:9100
          - 192.168.173.176:9100
          - 192.168.173.177:9100
          - 192.168.173.178:9100
        labels:
          role: compute

  - job_name: node-storage
    static_configs:
      - targets:
          - 192.168.173.172:9100
          - 192.168.173.173:9100
          - 192.168.173.174:9100
        labels:
          role: storage

# --- cAdvisor (Métricas de Contenedores) ---
# Nodos Storage: cAdvisor estándar vía HTTP
  - job_name: cadvisor-storage
    static_configs:
      - targets:
          - 192.168.173.172:8080
          - 192.168.173.173:8080
          - 192.168.173.174:8080
        labels:
          role: storage

# Nodos Compute: cAdvisor embebido en Kubelet (k3s) vía HTTPS
  - job_name: cadvisor-compute
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/k3s-token
    static_configs:
      - targets:
          - 192.168.173.175:10250
          - 192.168.173.176:10250
          - 192.168.173.177:10250
          - 192.168.173.178:10250
        labels:
          role: compute

# --- Kubernetes / k3s ---
# Métricas del Plano de Control (Solo en el Manager)
  - job_name: k3s-apiserver
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/k3s-token
    static_configs:
      - targets: ['192.168.173.178:6443']
        labels:
          cluster: k3s

# Métricas de salud del Kubelet en cada nodo
  - job_name: k3s-nodes
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/k3s-token
    static_configs:
      - targets:
          - 192.168.173.175:10250
          - 192.168.173.176:10250
          - 192.168.173.177:10250
          - 192.168.173.178:10250
        labels:
          cluster: k3s

# --- Ceph ---
  - job_name: ceph
    static_configs:
      - targets:
          - 192.168.173.172:9283
        labels:
          cluster: ceph

# --- Docker Daemon (Métricas del motor Docker) ---
  - job_name: docker-daemon
    static_configs:
      - targets:
          - 192.168.173.175:9323
          - 192.168.173.176:9323
          - 192.168.173.177:9323
          - 192.168.173.178:9323
        labels:
          role: swarm