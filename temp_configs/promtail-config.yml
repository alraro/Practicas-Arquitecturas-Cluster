# Archivo ~/monitoring/promtail-config.yml
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yaml

clients:
  - url: http://192.168.173.179:3100/loki/api/v1/push # Sustituir IP_ADMIN01 por la IP del nodo admin01

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: __HOSTNAME__
          __path__: /var/log/*.log

  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: __HOSTNAME__
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
        expressions:
          output: log
          stream: stream
      - output:
          source: output